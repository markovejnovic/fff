[package]
name = "fff-rg"
version = "0.0.1"
edition = "2024"
description = "FFF CLI — fast file finder from the command line."
license = "MIT"

[[bin]]
name = "fff-rg"
path = "src/main.rs"

[dependencies]
fff-ipc-domain = { path = "../fff-ipc-domain" }
iceoryx2 = { workspace = true, features = ["tracing"] }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
mimalloc = { workspace = true }
